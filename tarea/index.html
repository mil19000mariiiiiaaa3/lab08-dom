<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Películas</title>
</head>
<body>
    <h1>Películas por ver</h1>

    <form id="form-pelicula">
        <input type="text" id="titulo" placeholder="Nombre de la película" required>
        <input type="text" id="genero" placeholder="Género (ej. Acción)" required>
        <button type="submit">Agregar</button>
    </form>

    <ul id="lista-peliculas"></ul>

    <script src="app.js"></script>
</body>
</html>
